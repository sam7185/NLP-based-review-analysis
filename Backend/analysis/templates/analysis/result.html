{% extends "analysis/base.html" %}
{% block title %}Results - {{ hotel_name }}{% endblock %}

{% block content %}
<div>
    <h2 class="text-3xl font-bold text-blue-700 mb-2">{{ hotel_name }}</h2>
    <p class="text-gray-600 mb-6">Total Processed Reviews: 
        <span class="font-semibold text-gray-800">{{ review_count }}</span>
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Sentiment Pie -->
        <div id="sentiment_container" class="bg-white p-4 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">Sentiment Pie Chart</h3>
            <div id="sentiment_chart" class="w-full"></div>
        </div>

        <!-- Rating Trend -->
        <div id="trend_container" class="bg-white p-4 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">Rating Trend Over Time</h3>
            <div id="trend_chart" class="w-full"></div>
        </div>

        <!-- Country Distribution -->
        <div id="country_container" class="bg-white p-4 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">User Country Distribution</h3>
            <div id="country_chart" class="w-full"></div>
        </div>

        <!-- WordCloud -->
        <div class="bg-white p-4 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">Keyword Word Cloud</h3>
            <img src="{{ tags_wordcloud }}" alt="Keyword Cloud" class="w-full object-contain rounded">
        </div>
    </div>
</div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
    const charts = {{ charts|safe }};
    if (charts.sentiment) {
        Plotly.newPlot('sentiment_chart', charts.sentiment.data, charts.sentiment.layout);
    } else {
        document.getElementById('sentiment_container').style.display = 'none';
    }

    if (charts.trend) {
        Plotly.newPlot('trend_chart', charts.trend.data, charts.trend.layout);
    } else {
        document.getElementById('trend_container').style.display = 'none';
    }

    if (charts.country) {
        Plotly.newPlot('country_chart', charts.country.data, charts.country.layout);
    } else {
        document.getElementById('country_container').style.display = 'none';
    }
</script>
{% endblock %}
