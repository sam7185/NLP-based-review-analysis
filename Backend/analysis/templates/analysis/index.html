{% extends "analysis/base.html" %}
{% block title %}Hotel Review Analysis{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-xl">
        <h2 class="text-3xl font-bold text-center mb-6 text-blue-700">Analyze Your Hotel</h2>
        <form method="post">
            {% csrf_token %}
            <label for="hotel_url" class="block mb-2 text-gray-700 font-medium">
                Paste your Booking.com hotel URL:
            </label>
            <input 
                type="url" 
                name="hotel_url" 
                id="hotel_url" 
                required 
                class="w-full px-4 py-2 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="https://www.booking.com/hotel/..."
            >
            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md transition">
                Analyze Reviews
            </button>
        </form>
    </div>
</div>
{% endblock %}
